name: Build GOOUUU ESP32S3 CAM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        uses: cnadler86/micropython-camera-API/.github/actions/build@master
        with:
          board: GOOUUU_ESP32S3_CAM
          boards-path: boards

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-goouuu
          path: build/firmware.bin
